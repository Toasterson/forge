replicaCount: 1

image:
  repository: ghcr.io/toasterson/forge
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 50051

postgres:
  url: "postgresql://forged:forged@postgres:5432/forged"

seaweedfs:
  masterUrl: "http://seaweedfs-master:9333"

amqp:
  url: "amqp://dev:dev@rabbitmq:5672/master"

tls:
  mode: "none"

env:
  RUST_LOG: "forged=info,warn"

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

livenessProbe:
  tcpSocket:
    port: grpc
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  tcpSocket:
    port: grpc
  initialDelaySeconds: 5
  periodSeconds: 10
