# Cross configuration for building to illumos on x86_64
# See: https://github.com/cross-rs/cross

[target.x86_64-unknown-illumos]
# Prefer the maintained cross-rs image for illumos; it includes required toolchains and OpenSSL.
# If you need a different tag (e.g., edge), update below.
image = "ghcr.io/cross-rs/x86_64-unknown-illumos:edge"

# Some crates may try to run build scripts; ensure pkg-config works when needed.
# environment = { }

[build.env]
# Allow passing sysroot and pkg-config hints from the host environment into the cross container.
# This enables using a local illumos sysroot created via scripts/mk-illumos-sysroot.sh.
passthrough = [
    "SYSROOT",
    "PKG_CONFIG_SYSROOT_DIR",
    "PKG_CONFIG_LIBDIR",
    "PKG_CONFIG_PATH",
    "PKG_CONFIG_ALLOW_CROSS",
    "CFLAGS",
    "CXXFLAGS",
    "LDFLAGS",
    "RUSTFLAGS",
    "OPENSSL_DIR",
    "OPENSSL_NO_VENDOR",
    "LIBARCHIVE_DIR",
]
