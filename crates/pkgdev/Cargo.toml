[package]
name = "pkgdev"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Package development utility to interact and use package kdl metadata"

[build-dependencies]
prettyplease = "0.2.22"
progenitor = { git = "https://github.com/oxidecomputer/progenitor" }
serde_json.workspace = true
syn = "2.0.77"

[dependencies]
component.workspace = true
integration.workspace = true
thiserror.workspace = true
miette = { workspace = true, features = ["fancy"] }
forge_config = { version = "*", path = "../forge_config" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true
clap = { workspace = true, features = ["derive"] }
strum.workspace = true
reqwest = { package = "reqwest", version = "0.12", features = ["native-tls", "json", "multipart", "stream"], default-features = false }
workspace = { version = "*", path = "../workspace" }
repology.workspace = true
semver = { version = "1.0.22", features = ["serde"] }
gate.workspace = true
directories = "5.0.1"
forge.workspace = true
tokio.workspace = true
#octocrab = { version = "0.41.2" ,default-features = false, features = ["opentls", "follow-redirect", "retry", "timeout", "tracing", "default-client" ] }
secrecy = { version = "0.10.3", features = ["serde"] }
either = "1.11.0"
progenitor-client = { git = "https://github.com/oxidecomputer/progenitor" }
shellexpand = "3.1.0"
fs_extra = "1.3.0"
compress-tools = { version = "0.15.1", features = ["blocking"] }
microtemplate = "1.0.3"
file-matcher = "0.7.0"
uuid = { workspace = true, features = ["serde", "v4"] }
libips = { git = "https://github.com/OpenFlowLabs/ips.git", optional = true }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
cargo_metadata = "0.22"

[features]
default = ["libips"]
# Enable libips integration against the external library.
libips = ["dep:libips"]
