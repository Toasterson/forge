[package]
name = "forged"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
otel = []
quic = ["quiche"]

[dependencies]
# Application crates may enable fancy miette per guidelines
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "1.0.50"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
tracing-opentelemetry = "0.27.0"
opentelemetry = "0.26.0"
opentelemetry_sdk = { version = "0.26.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.17.0", features = ["grpc-tonic"] }

# Async runtime
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util"] }
async-trait = "0.1"
futures = "0.3"

# Storage - PostgreSQL + SeaORM
sea-orm = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-postgres", "macros"] }
sea-orm-migration = "1.1"
forged-migration = { path = "migration" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.8.1"
base64 = "0.22"
bincode = "1.3"

# Auth
jsonwebtoken = "9.3"

# Config / CLI
config = "0.14"
clap = { version = "4.5", features = ["derive"] }

# Misc
semver = "1.0"
kdl = "4.6"
chrono = { version = "0.4", features = ["serde"] }

# gRPC
tonic = { version = "0.11", features = ["transport", "tls"] }
prost = "0.12"
tonic-health = "0.11"
tower = "0.4"
http = "0.2"
# Streaming helpers
tokio-stream = "0.1"

# IDs
uuid = { version = "1.8", features = ["v4", "serde"] }

# QUIC (optional stub)
quiche = { version = "0.21", optional = true }

# Utilities
anyhow = "1.0"
rand = "0.8"
tokio-util = "0.7"
futures-util = "0.3"

# Solstice CI build dispatch
# Note: solstice-common git dep unavailable (SHA256 object format, cargo#14942)
# Using compatible message types + deadpool-lapin directly
deadpool-lapin = { workspace = true }
time = { version = "0.3", features = ["serde", "serde-human-readable"] }

# Crypto
age = { version = "0.11", features = ["ssh"] }
ssh-key = { version = "0.6", features = ["ed25519", "rand_core"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["builder", "serde", "tokio1", "smtp-transport", "hostname", "rustls-tls", "tokio1-rustls-tls"] }

# Jujutsu VCS
jj-lib = "0.24"
jj-cli = "0.24"

# SeaweedFS client (HTTP)
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Content addressing & crypto
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"

# Type builders
typed-builder = "0.20"

# TLS + ACME
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
instant-acme = { version = "0.8", features = ["rcgen"] }
rcgen = "0.13"
rustls-pemfile = "2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Base gate model + KDL parsing
gate = { workspace = true }
component = { workspace = true }
knuffel = { workspace = true }

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
forged-client = { path = "../forged-client" }
serial_test = "3.0"  # For tests that must run serially
tokio-test = "0.4"  # Testing utilities for tokio
