[package]
name = "forged"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
otel = []
quic = ["quiche"]

[dependencies]
# Application crates may enable fancy miette per guidelines
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "1.0.50"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
tracing-opentelemetry = "0.27.0"
opentelemetry = "0.26.0"
opentelemetry_sdk = { version = "0.26.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.17.0", features = ["grpc-tonic"] }

# Async runtime
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "signal", "time"] }

# Storage
surrealdb = { version = "1.5.4", features = ["kv-rocksdb", "protocol-ws"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.8.1"
base64 = "0.22"

# Auth
jsonwebtoken = "9.3"

# Config / CLI
config = "0.14"
clap = { version = "4.5", features = ["derive"] }

# Misc
semver = "1.0"
kdl = "4.6"

# gRPC
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
tonic-health = "0.11"

# IDs
uuid = { version = "1.8", features = ["v4", "serde"] }

# QUIC (optional stub)
quiche = { version = "0.21", optional = true }

# Utilities
anyhow = "1.0"
rand = "0.8"

# Crypto
age = { version = "0.11", features = ["ssh"] }
rage = "0.11"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["builder", "serde", "tokio1", "smtp-transport", "hostname", "rustls-tls", "tokio1-rustls-tls"] }

# Base gate model
gate = { workspace = true }
component = { workspace = true }

[build-dependencies]
tonic-build = "0.11"
