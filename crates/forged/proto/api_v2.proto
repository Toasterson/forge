syntax = "proto3";

package forged.api.v2;

// ========== Common Types ==========

message ContentHash {
  string hex = 1; // SHA256 hash as hex string
}

message ActorRef {
  string id = 1;
  string kind = 2; // "user" or "service"
}

message GateId {
  string id = 1;
}

message ComponentId {
  string id = 1;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

// ========== Auth Service ==========

service AuthService {
  // Validates OIDC token and returns or creates actor
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);

  // Register a new actor with an SSH public key
  // Sends an age-encrypted confirmation envelope via email
  rpc RegisterActor(RegisterActorRequest) returns (RegisterActorResponse);

  // Confirm registration by decrypting the challenge envelope
  rpc RegistrationConfirmation(RegistrationConfirmationRequest) returns (RegistrationConfirmationResponse);

  // Add a new SSH key to an existing actor (requires proof signature)
  rpc AddActorKey(AddActorKeyRequest) returns (AddActorKeyResponse);

  // Token issuance is handled by the OIDC provider, not forged
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse);
}

message AuthenticateRequest {
  string oidc_token = 1;
}

message AuthenticateResponse {
  ActorRef actor = 1;
  string display_name = 2;
}

message RegisterActorRequest {
  string display_name = 1;
  string email = 2;
  string public_key = 3;     // SSH public key (e.g. "ssh-ed25519 AAAA...")
  string key_id = 4;         // Human-readable label for the key
}

message RegisterActorResponse {
  ActorRef actor = 1;
  string confirmation_envelope = 2; // age-encrypted challenge (also sent via email)
}

message RegistrationConfirmationRequest {
  string actor_id = 1;
  string decrypted_challenge = 2; // The decrypted challenge string
}

message RegistrationConfirmationResponse {
  bool confirmed = 1;
  string display_name = 2;
}

message AddActorKeyRequest {
  ActorRef actor = 1;
  string public_key = 2;     // New SSH public key
  string key_id = 3;         // Human-readable label
  string proof_signature = 4; // Signature of a challenge using an existing key
  string proof_key_id = 5;   // key_id of the key used to sign the proof
}

message AddActorKeyResponse {
  bool success = 1;
  string key_id = 2;
}

message IssueTokenRequest {
  // Intentionally empty — this RPC always returns UNIMPLEMENTED
}

message IssueTokenResponse {
  // Intentionally empty — this RPC always returns UNIMPLEMENTED
}

// ========== Gate Service ==========

service GateService {
  // Create a new gate
  rpc CreateGate(CreateGateRequest) returns (CreateGateResponse);

  // Get gate details
  rpc GetGate(GetGateRequest) returns (GetGateResponse);

  // Update gate KDL
  rpc UpdateGate(UpdateGateRequest) returns (UpdateGateResponse);

  // Add a member to a gate
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);

  // Remove a member from a gate
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // List all members of a gate
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  // List all components in a gate
  rpc ListComponents(ListComponentsRequest) returns (ListComponentsResponse);

  // List all gates (optionally filtered by owner)
  rpc ListGates(ListGatesRequest) returns (ListGatesResponse);
}

message CreateGateRequest {
  ActorRef actor = 1;
  string name = 2;
  string gate_kdl = 3;
}

message CreateGateResponse {
  GateInfo gate = 1;
}

message GetGateRequest {
  ActorRef actor = 1;
  GateId gate_id = 2;
}

message GetGateResponse {
  GateInfo gate = 1;
}

message UpdateGateRequest {
  ActorRef actor = 1;
  GateId gate_id = 2;
  string gate_kdl = 3;
}

message UpdateGateResponse {
  GateInfo gate = 1;
}

message AddMemberRequest {
  ActorRef actor = 1;
  GateId gate_id = 2;
  string member_actor_id = 3;
  repeated string roles = 4;
  repeated string permissions = 5;
}

message AddMemberResponse {
  GateMemberInfo member = 1;
}

message RemoveMemberRequest {
  ActorRef actor = 1;
  GateId gate_id = 2;
  string member_actor_id = 3;
}

message RemoveMemberResponse {
  bool success = 1;
}

message ListMembersRequest {
  ActorRef actor = 1;
  GateId gate_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListMembersResponse {
  repeated GateMemberInfo members = 1;
  string next_page_token = 2;
}

message ListComponentsRequest {
  ActorRef actor = 1;
  GateId gate_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListComponentsResponse {
  repeated ComponentInfo components = 1;
  string next_page_token = 2;
}

message ListGatesRequest {
  ActorRef actor = 1;
  optional string owner_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListGatesResponse {
  repeated GateInfo gates = 1;
  string next_page_token = 2;
}

message GateInfo {
  string id = 1;
  string name = 2;
  string gate_kdl = 3;
  string owner_id = 4;
  Timestamp created_at = 5;
  Timestamp updated_at = 6;
}

message GateMemberInfo {
  string gate_id = 1;
  string actor_id = 2;
  repeated string roles = 3;
  repeated string permissions = 4;
  Timestamp created_at = 5;
}

// ========== Component Service ==========

service ComponentService {
  // Create a new component
  rpc CreateComponent(CreateComponentRequest) returns (CreateComponentResponse);

  // Get component details
  rpc GetComponent(GetComponentRequest) returns (GetComponentResponse);

  // Update component recipe KDL
  rpc UpdateComponent(UpdateComponentRequest) returns (UpdateComponentResponse);

  // Upload a source archive
  rpc UploadSourceArchive(stream UploadSourceArchiveRequest) returns (UploadSourceArchiveResponse);

  // Upload a component file (patch, license, or script)
  rpc UploadComponentFile(stream UploadComponentFileRequest) returns (UploadComponentFileResponse);

  // List source archives for a component
  rpc ListSourceArchives(ListSourceArchivesRequest) returns (ListSourceArchivesResponse);

  // List component files
  rpc ListComponentFiles(ListComponentFilesRequest) returns (ListComponentFilesResponse);
}

message CreateComponentRequest {
  ActorRef actor = 1;
  GateId gate_id = 2;
  string name = 3;
  string recipe_kdl = 4;
}

message CreateComponentResponse {
  ComponentInfo component = 1;
}

message GetComponentRequest {
  ActorRef actor = 1;
  ComponentId component_id = 2;
}

message GetComponentResponse {
  ComponentInfo component = 1;
}

message UpdateComponentRequest {
  ActorRef actor = 1;
  ComponentId component_id = 2;
  string recipe_kdl = 3;
}

message UpdateComponentResponse {
  ComponentInfo component = 1;
}

message UploadSourceArchiveRequest {
  // First message contains metadata
  oneof data {
    ArchiveMetadata metadata = 1;
    bytes chunk = 2; // Subsequent messages contain data chunks
  }
}

message ArchiveMetadata {
  ActorRef actor = 1;
  ComponentId component_id = 2;
  string filename = 3;
  optional string url = 4; // Original URL if fetched from remote
  int64 total_size = 5;
}

message UploadSourceArchiveResponse {
  SourceArchiveInfo archive = 1;
}

message UploadComponentFileRequest {
  // First message contains metadata
  oneof data {
    FileMetadata metadata = 1;
    bytes chunk = 2; // Subsequent messages contain data chunks
  }
}

message FileMetadata {
  ActorRef actor = 1;
  ComponentId component_id = 2;
  string kind = 3; // "patch", "license", or "script"
  string name = 4;
  string rel_path = 5;
  int64 total_size = 6;
}

message UploadComponentFileResponse {
  ComponentFileInfo file = 1;
}

message ListSourceArchivesRequest {
  ActorRef actor = 1;
  ComponentId component_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListSourceArchivesResponse {
  repeated SourceArchiveInfo archives = 1;
  string next_page_token = 2;
}

message ListComponentFilesRequest {
  ActorRef actor = 1;
  ComponentId component_id = 2;
  optional string kind = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListComponentFilesResponse {
  repeated ComponentFileInfo files = 1;
  string next_page_token = 2;
}

message ComponentInfo {
  string id = 1;
  string gate_id = 2;
  string name = 3;
  string recipe_kdl = 4;
  Timestamp created_at = 5;
  Timestamp updated_at = 6;
}

message SourceArchiveInfo {
  int64 id = 1;
  string component_id = 2;
  string filename = 3;
  optional string url = 4;
  ContentHash hash = 5;
  int64 size_bytes = 6;
  Timestamp created_at = 7;
}

message ComponentFileInfo {
  int64 id = 1;
  string component_id = 2;
  string kind = 3; // "patch", "license", "script"
  string name = 4;
  string rel_path = 5;
  ContentHash hash = 6;
  int64 size_bytes = 7;
  Timestamp created_at = 8;
}

// ========== Build Service ==========

service BuildService {
  // Get build manifest for a component (all files needed to build)
  rpc GetBuildManifest(GetBuildManifestRequest) returns (GetBuildManifestResponse);

  // Download a blob by hash (streaming)
  rpc DownloadBlob(DownloadBlobRequest) returns (stream DownloadBlobResponse);

  // Submit a build for a component (dispatches to Solstice CI via AMQP)
  rpc SubmitBuild(SubmitBuildRequest) returns (SubmitBuildResponse);

  // Get build job status
  rpc GetBuildStatus(GetBuildStatusRequest) returns (GetBuildStatusResponse);

  // List builds for a component
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse);

  // Cancel a build job
  rpc CancelBuild(CancelBuildRequest) returns (CancelBuildResponse);
}

message GetBuildManifestRequest {
  ActorRef actor = 1;
  ComponentId component_id = 2;
}

message GetBuildManifestResponse {
  BuildManifest manifest = 1;
}

message BuildManifest {
  ComponentId component_id = 1;
  string component_name = 2;
  string recipe_kdl = 3;
  repeated SourceArchiveInfo source_archives = 4;
  repeated ComponentFileInfo patches = 5;
  repeated ComponentFileInfo licenses = 6;
  repeated ComponentFileInfo scripts = 7;
}

message DownloadBlobRequest {
  ActorRef actor = 1;
  ContentHash hash = 2;
  string blob_type = 3; // "source_archive", "patch", "license", "script"
}

message DownloadBlobResponse {
  bytes chunk = 1; // 64KB chunks
  int64 total_size = 2; // Only set in first response
  int64 offset = 3; // Byte offset of this chunk
}

message SubmitBuildRequest {
  ComponentId component_id = 1;
  GateId gate_id = 2;
}

message SubmitBuildResponse {
  BuildJobInfo job = 1;
}

message GetBuildStatusRequest {
  string job_id = 1;
}

message GetBuildStatusResponse {
  BuildJobInfo job = 1;
}

message ListBuildsRequest {
  ComponentId component_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListBuildsResponse {
  repeated BuildJobInfo jobs = 1;
  string next_page_token = 2;
}

message CancelBuildRequest {
  string job_id = 1;
}

message CancelBuildResponse {
  BuildJobInfo job = 1;
}

message BuildJobInfo {
  string id = 1;
  string component_id = 2;
  string gate_id = 3;
  string actor_id = 4;
  string request_id = 5;
  string status = 6; // queued, running, success, failed, cancelled
  optional int32 exit_code = 7;
  optional string summary = 8;
  optional string build_log_url = 9;
  Timestamp created_at = 10;
  Timestamp updated_at = 11;
  optional Timestamp completed_at = 12;
}
