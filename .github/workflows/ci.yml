name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-build-test:
    name: Lint, build, test (no e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang pkg-config libssl-dev libarchive-dev
      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: tests (unit/integration; e2e ignored by default)
        run: cargo test --workspace --locked -- --nocapture

  cross-illumos:
    name: Cross build for illumos (x86_64-unknown-illumos)
    needs: [lint-build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Cross build forged + pkgdev (debug)
        run: cross build --target x86_64-unknown-illumos -p forged -p pkgdev --locked
      - name: Cross build forged + pkgdev (release)
        run: cross build --target x86_64-unknown-illumos -p forged -p pkgdev --locked --release

  e2e:
    name: End-to-end tests (main only)
    needs: [lint-build-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang pkg-config libssl-dev libarchive-dev
      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: Build
        run: cargo build -p forged --locked --release
      - name: Run e2e
        run: |
          # Run the ignored e2e test explicitly with a generous timeout
          cargo test -p forged --test e2e_git -- --ignored --nocapture

  docker:
    name: Build and publish Docker image
    needs: [lint-build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/forge
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Package and publish Helm chart (OCI)
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Helm registry login (GHCR)
        run: echo "$HELM_PASS" | helm registry login ghcr.io -u "$HELM_USER" --password-stdin
        env:
          HELM_USER: ${{ github.actor }}
          HELM_PASS: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute chart version and image tag
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            IMAGE_TAG=latest
            CHART_VERSION=0.1.0
          elif [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            IMAGE_TAG=develop
            CHART_VERSION=0.1.0-dev-${SHORT_SHA}
          else
            IMAGE_TAG=${SHORT_SHA}
            CHART_VERSION=0.1.0-${SHORT_SHA}
          fi
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
      - name: Package chart
        run: helm package charts/forged --version ${{ steps.vars.outputs.chart_version }} --app-version ${{ steps.vars.outputs.image_tag }}
      - name: Push chart to GHCR OCI
        run: |
          helm push forged-${{ steps.vars.outputs.chart_version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
