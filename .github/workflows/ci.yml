name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-build-test:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang pkg-config libssl-dev libarchive-dev
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: unit tests
        run: cargo test --workspace --locked

  e2e:
    name: End-to-end tests
    needs: [lint-build-test]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forged_test
          POSTGRES_USER: forged
          POSTGRES_PASSWORD: forged
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_VHOST: master
          RABBITMQ_DEFAULT_USER: dev
          RABBITMQ_DEFAULT_PASS: dev
        options: >-
          --health-cmd "rabbitmqctl status"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang pkg-config libssl-dev libarchive-dev
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs-master --network host \
            chrislusf/seaweedfs:latest master -ip=127.0.0.1 -port=9333
          # Wait for master to elect leader
          for i in $(seq 1 30); do
            curl -sf http://localhost:9333/cluster/status && break
            sleep 1
          done
          docker run -d --name seaweedfs-volume --network host \
            chrislusf/seaweedfs:latest volume -mserver=127.0.0.1:9333 -port=8080 -publicUrl=localhost:8080
          # Wait for volume to register with master
          for i in $(seq 1 30); do
            curl -sf http://localhost:9333/dir/assign && break
            sleep 1
          done
          echo "SeaweedFS ready"

      - name: Run e2e tests
        env:
          TEST_DATABASE_URL: postgresql://forged:forged@localhost/forged_test
          TEST_SEAWEEDFS_URL: http://localhost:9333
          RUST_LOG: forged=info,warn
        run: cargo test -p forged --test e2e_git --locked -- --ignored --nocapture

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://forged:forged@localhost/forged_test
          TEST_SEAWEEDFS_URL: http://localhost:9333
          RUST_LOG: forged=info,warn
        run: cargo test -p forged --test integration_test --locked -- --ignored --nocapture

      - name: Stop SeaweedFS
        if: always()
        run: |
          docker stop seaweedfs-volume seaweedfs-master || true
          docker rm seaweedfs-volume seaweedfs-master || true

  docker:
    name: Build and publish Docker image
    needs: [lint-build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/forge
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Package and publish Helm chart
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Helm registry login
        run: echo "$HELM_PASS" | helm registry login ghcr.io -u "$HELM_USER" --password-stdin
        env:
          HELM_USER: ${{ github.actor }}
          HELM_PASS: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute versions
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "image_tag=latest" >> $GITHUB_OUTPUT
            echo "chart_version=0.1.0" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            echo "image_tag=develop" >> $GITHUB_OUTPUT
            echo "chart_version=0.1.0-dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "chart_version=0.1.0-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi
      - name: Package chart
        run: helm package charts/forged --version ${{ steps.vars.outputs.chart_version }} --app-version ${{ steps.vars.outputs.image_tag }}
      - name: Push chart
        run: helm push forged-${{ steps.vars.outputs.chart_version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
