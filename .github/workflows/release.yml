name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build release binaries (Linux + illumos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang pkg-config libssl-dev
      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: Compute version from tag or release
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            # refs/tags/v1.2.3
            TAG_NAME="${GITHUB_REF##*/}"
          fi
          VER="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
      - name: Build Linux (x86_64-unknown-linux-gnu)
        run: |
          cargo build -p pkgdev --release --locked
          cargo build -p forged --release --locked
      - name: Prepare Linux artifacts
        run: |
          mkdir -p dist
          cp target/release/pkgdev ./dist/pkgdev
          cp target/release/forged ./dist/forged
          tar -C dist -czf pkgdev-${{ steps.ver.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz pkgdev
          tar -C dist -czf forged-${{ steps.ver.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz forged
      - name: Try build illumos (x86_64-unknown-illumos)
        continue-on-error: true
        run: |
          rustup target add x86_64-unknown-illumos || true
          # Some crates may not support illumos cross-compile; try best-effort
          cargo build -p pkgdev --release --target x86_64-unknown-illumos --locked || true
          cargo build -p forged --release --target x86_64-unknown-illumos --locked || true
          if [ -f target/x86_64-unknown-illumos/release/pkgdev ]; then
            tar -C target/x86_64-unknown-illumos/release -czf pkgdev-${{ steps.ver.outputs.version }}-x86_64-unknown-illumos.tar.gz pkgdev
          fi
          if [ -f target/x86_64-unknown-illumos/release/forged ]; then
            tar -C target/x86_64-unknown-illumos/release -czf forged-${{ steps.ver.outputs.version }}-x86_64-unknown-illumos.tar.gz forged
          fi
      - name: Checksums
        run: |
          shopt -s nullglob
          sha256sum *.tar.gz > SHA256SUMS.txt
      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            *.tar.gz
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and publish Docker image (version tag)
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version from tag or release
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF##*/}"
          fi
          VER="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/forged
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.tag }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Package and publish Helm chart pointing at released image
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version from tag or release
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF##*/}"
          fi
          VER="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Helm registry login (GHCR)
        run: echo "$HELM_PASS" | helm registry login ghcr.io -u "$HELM_USER" --password-stdin
        env:
          HELM_USER: ${{ github.actor }}
          HELM_PASS: ${{ secrets.GITHUB_TOKEN }}
      - name: Update chart values to use released image tag and repository
        shell: bash
        run: |
          OWNER_ESCAPED=$(printf '%s\n' "${{ github.repository_owner }}" | sed 's/[\/&]/\\&/g')
          sed -i "s#ghcr.io/OWNER/forged#ghcr.io/${OWNER_ESCAPED}/forged#g" charts/forged/values.yaml
          sed -i "s/^  tag: .*/  tag: ${{ steps.ver.outputs.version }}/" charts/forged/values.yaml
      - name: Package chart
        run: |
          helm package charts/forged \
            --version ${{ steps.ver.outputs.version }} \
            --app-version ${{ steps.ver.outputs.version }}
      - name: Push chart to GHCR OCI
        run: |
          helm push forged-${{ steps.ver.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
